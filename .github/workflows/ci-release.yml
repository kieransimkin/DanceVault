name: Validate and publish DanceVault
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dancevault-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Lint and synthetic security contracts
        run: |
          php --version
          php -r 'if (!extension_loaded("sodium")) exit(1);'
          find . -name '*.php' -not -path './dist/*' -print0 | xargs -0 -n1 php -l
          php tests/crypto.php
          php tests/handlers.php
      - name: Build and inspect package
        shell: pwsh
        run: |
          ./scripts/package.ps1
          ./scripts/verify-package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: tested-wordpress-package
          path: dist/
          if-no-files-found: error
  hosting:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - {backend: apache, php: '8.0', wordpress: '6.7'}
          - {backend: nginx, php: '8.0', wordpress: '6.7'}
          - {backend: apache, php: '8.3', wordpress: '7.1.3'}
          - {backend: nginx, php: '8.3', wordpress: '7.1.3'}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: tested-wordpress-package
          path: dist/
      - name: Real WordPress and TLS hosting acceptance
        run: bash tests/integration/run.sh ${{ matrix.backend }} ${{ matrix.php }} ${{ matrix.wordpress }}
      - name: Retain synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosting-evidence-${{ matrix.backend }}-php${{ matrix.php }}-wp${{ matrix.wordpress }}
          path: tests/integration/.state/${{ matrix.backend }}/evidence/
          if-no-files-found: warn
  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [validate, hosting]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: tested-wordpress-package
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          pattern: hosting-evidence-*
          path: hosting-evidence/
      - name: Verify exact tested artifact against the immutable tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./scripts/verify-package.ps1 -ExpectedTag $env:RELEASE_TAG
          if ((git rev-parse HEAD) -cne (git rev-parse "refs/tags/$($env:RELEASE_TAG)^{commit}")) { throw 'Tag/source mismatch' }
      - name: Verify all real-host reports and prepare notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          version = os.environ['RELEASE_TAG'][1:]
          package = pathlib.Path(f'dist/dancevault-{version}-wordpress.zip')
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          reports = [json.loads(p.read_text()) for p in pathlib.Path('hosting-evidence').glob('*/acceptance.json')]
          expected = {('apache', '6.7', '8.0'), ('nginx', '6.7', '8.0'), ('apache', '7.1.3', '8.3'), ('nginx', '7.1.3', '8.3')}
          actual = {(r['backend'], r['wordpress'], '.'.join(r['php'].split('.')[:2])) for r in reports}
          assert len(reports) == 4 and actual == expected
          assert all(r['passed'] and r['count'] > 0 and r['plugin_version'] == version and r['package_sha256'] == digest for r in reports)
          rows = '\n'.join(f"| {r['backend']} | {r['wordpress']} | {r['php']} | {r['count']} |" for r in sorted(reports, key=lambda r: (r['wordpress'], r['backend'])))
          notes = f"DanceVault {version}\n\nWebsite: https://kieransimkin.co.uk/danceflow/\n\nValidated source: {os.environ['GITHUB_SHA']}.\n\nReal isolated WordPress/TLS acceptance of the exact attached ZIP:\n\n| Server | WordPress | PHP | Passed checks |\n| --- | --- | --- | --- |\n{rows}\n\nSHA256: `{digest}`. Crypto, malformed-request, packaging and all hosting gates passed. The 1.0 series fixes array-valued request handling and retains the existing encryption format. Host-specific configuration acceptance is still required before private assets; this is not a production installation or independent security audit. See the included hosting guide and changelog.\n"
          pathlib.Path('release-notes.md').write_text(notes)
          PY
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          flags=()
          if [[ "$version" == 0.* ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$RELEASE_TAG" "dist/dancevault-$version-wordpress.zip" "dist/SHA256SUMS-$version.txt" --verify-tag "${flags[@]}" --title "DanceVault $version" --notes-file release-notes.md
          mkdir -p verification
          gh release download "$RELEASE_TAG" --dir verification
          (cd verification && sha256sum -c "SHA256SUMS-$version.txt")
