name: Validate and publish DanceVault
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dancevault-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Lint and synthetic security contracts
        run: |
          php --version
          php -r 'if (!extension_loaded("sodium")) exit(1);'
          find . -name '*.php' -not -path './dist/*' -print0 | xargs -0 -n1 php -l
          php tests/crypto.php
          php tests/handlers.php
      - name: Build and inspect package
        shell: pwsh
        run: |
          ./scripts/package.ps1
          ./scripts/verify-package.ps1
  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build exact tag and verify version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./scripts/package.ps1
          ./scripts/verify-package.ps1 -ExpectedTag $env:RELEASE_TAG
      - name: Publish immutable experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" "dist/dancevault-$version-wordpress.zip" "dist/SHA256SUMS-$version.txt" --verify-tag --prerelease --title "DanceVault $version — experimental" --notes "Validated source: $GITHUB_SHA. Synthetic crypto and handler checks passed. Live WordPress, Apache/nginx integration and private hosting acceptance remain separate gates. No automatic WordPress deployment. Exact ZIP and checksums attached."
          mkdir -p verification
          gh release download "$RELEASE_TAG" --dir verification
          (cd verification && sha256sum -c "SHA256SUMS-$version.txt")
