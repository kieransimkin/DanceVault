name: Validate and publish DanceVault
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dancevault-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Lint and synthetic security contracts
        run: |
          php --version
          php -r 'if (!extension_loaded("sodium")) exit(1);'
          find . -name '*.php' -not -path './dist/*' -print0 | xargs -0 -n1 php -l
          php tests/crypto.php
          php tests/handlers.php
      - name: Build and inspect package
        shell: pwsh
        run: |
          ./scripts/package.ps1
          ./scripts/verify-package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: tested-wordpress-package
          path: dist/
          if-no-files-found: error
  hosting:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - {backend: apache, php: '8.0', wordpress: '6.7'}
          - {backend: nginx, php: '8.0', wordpress: '6.7'}
          - {backend: apache, php: '8.3', wordpress: '7.1.3'}
          - {backend: nginx, php: '8.3', wordpress: '7.1.3'}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: tested-wordpress-package
          path: dist/
      - name: Real WordPress and TLS hosting acceptance
        run: bash tests/integration/run.sh ${{ matrix.backend }} ${{ matrix.php }} ${{ matrix.wordpress }}
      - name: Retain synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosting-evidence-${{ matrix.backend }}-php${{ matrix.php }}-wp${{ matrix.wordpress }}
          path: tests/integration/.state/${{ matrix.backend }}/evidence/
          if-no-files-found: warn
  release-evidence:
    needs: [validate, hosting]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: tested-wordpress-package
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          pattern: hosting-evidence-*
          path: hosting-evidence/
      - name: Verify packaged source
        shell: pwsh
        run: ./scripts/verify-package.ps1
      - name: Verify all four complete hosting reports
        run: python3 scripts/release-evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-bundle
          path: dist/
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: release-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-bundle
          path: dist/
      - name: Verify exact tested artifact against the immutable tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./scripts/verify-package.ps1 -ExpectedTag $env:RELEASE_TAG
          if ((git rev-parse HEAD) -cne (git rev-parse "refs/tags/$($env:RELEASE_TAG)^{commit}")) { throw 'Tag/source mismatch' }
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          flags=()
          if [[ "$version" == 0.* ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$RELEASE_TAG" "dist/dancevault-$version-wordpress.zip" "dist/SHA256SUMS-$version.txt" "dist/acceptance-summary.json" --verify-tag "${flags[@]}" --title "DanceVault $version" --notes-file dist/release-notes.md
          mkdir -p verification
          gh release download "$RELEASE_TAG" --dir verification
          (cd verification && sha256sum -c "SHA256SUMS-$version.txt")
