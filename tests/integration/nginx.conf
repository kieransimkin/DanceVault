server {
    listen 80;
    server_name localhost;
    include /etc/nginx/dancevault-protection.conf;
    include /etc/nginx/dancevault-common.conf;
}
server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /tls/cert.pem;
    ssl_certificate_key /tls/key.pem;
    include /etc/nginx/dancevault-protection.conf;
    include /etc/nginx/dancevault-common.conf;
}
# Deliberately missing defence in depth, ONLY for disposable ciphertext tests.
server {
    listen 444 ssl;
    server_name localhost;
    ssl_certificate /tls/cert.pem;
    ssl_certificate_key /tls/key.pem;
    include /etc/nginx/dancevault-common.conf;
}
