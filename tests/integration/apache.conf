# mod_ssl's packaged ports.conf already declares 443.
Listen 444
ServerName localhost
<Directory /var/www/html>
    Require all granted
    AllowOverride All
</Directory>
<VirtualHost *:80>
    DocumentRoot /var/www/html
</VirtualHost>
<VirtualHost *:443>
    DocumentRoot /var/www/html
    SSLEngine on
    SSLCertificateFile /tls/cert.pem
    SSLCertificateKeyFile /tls/key.pem
</VirtualHost>
# Deliberately missing defence in depth, ONLY for disposable ciphertext tests.
<VirtualHost *:444>
    DocumentRoot /var/www/html
    SSLEngine on
    SSLCertificateFile /tls/cert.pem
    SSLCertificateKeyFile /tls/key.pem
    <Directory /var/www/html>
        AllowOverride None
    </Directory>
</VirtualHost>
